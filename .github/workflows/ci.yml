# Runs the Python pipeline tests and the frontend production build on every push and PR.
# CI only: no deployment, no Cloudflare credentials, no database access.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use the interpreter from setup-python instead of letting uv download one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      # pytest exits non-zero on failures and when no tests are collected.
      # Tests use synthetic fixtures; the real-dataset tests skip because data/raw is not in Git.
      - name: Run pytest
        run: uv run --locked python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Same Node major as the Cloudflare Pages build (NODE_VERSION=22).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL is read at runtime by src/api/client.ts, so the build does not need it.
      - name: Production build
        run: npm run build
